name: Release Binaries

on:
  push:
    tags:
      - 'protocol-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            artifact: citizen-node-linux-x86_64
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            artifact: citizen-node-linux-arm64
            archive: tar.gz
          - target: x86_64-pc-windows-gnu
            runner: ubuntu-22.04
            artifact: citizen-node-windows-x86_64.exe
            archive: zip
          - target: x86_64-apple-darwin
            runner: macos-13
            artifact: citizen-node-macos-x86_64
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-14
            artifact: citizen-node-macos-arm64
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "citizen-protocol"
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install cross-compilation tools (Windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build
        working-directory: citizen-protocol
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR: aarch64-linux-gnu-ar
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename and archive binary
        shell: bash
        run: |
          cd citizen-protocol/target/${{ matrix.target }}/release
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp citizen-node.exe ${{ matrix.artifact }}
            zip ${{ matrix.artifact }}.zip ${{ matrix.artifact }}
          else
            cp citizen-node ${{ matrix.artifact }}
            tar czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: citizen-protocol/target/${{ matrix.target }}/release/${{ matrix.artifact }}.${{ matrix.archive }}

  release:
    name: Publish to public repo
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release in public repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#protocol-}"
          gh release create "$VERSION" \
            --repo greenarmor/citizen-protocol-v0.1.0 \
            --title "Citizen Protocol $VERSION" \
            --generate-notes \
            artifacts/*
