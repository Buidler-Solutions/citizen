name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'whitepaper/frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: whitepaper/frontend/package-lock.json

      - name: Install dependencies
        working-directory: whitepaper/frontend
        run: npm ci

      - name: Build static export
        working-directory: whitepaper/frontend
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: whitepaper/frontend/out
          publish_branch: gh-pages
          force_orphan: true
