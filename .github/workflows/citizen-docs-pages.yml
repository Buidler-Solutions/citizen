name: citizen-docs-pages

on:
  push:
    branches: [github-pages]
    paths:
      - 'citizen-protocol/docs/**'
      - 'citizen-protocol/mkdocs.yml'
      - 'citizen-protocol/requirements-docs.txt'
      - '.github/workflows/citizen-docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == 'github-pages'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: citizen-protocol
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build MkDocs site
        run: mkdocs build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: citizen-protocol/site

  deploy:
    if: github.ref_name == 'github-pages'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
