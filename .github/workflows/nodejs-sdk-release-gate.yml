name: nodejs-sdk-release-gate

on:
  pull_request:
    paths:
      - "citizen-protocol/sdk/nodejs/**"
      - "citizen-protocol/dapp/apps/api/**"
      - "citizen-protocol/crates/**"
      - "citizen-protocol/config/localnet/**"
      - ".github/workflows/nodejs-sdk-release-gate.yml"
  push:
    branches:
      - main
    paths:
      - "citizen-protocol/sdk/nodejs/**"
      - "citizen-protocol/dapp/apps/api/**"
      - "citizen-protocol/crates/**"
      - "citizen-protocol/config/localnet/**"
      - ".github/workflows/nodejs-sdk-release-gate.yml"

jobs:
  sdk-unit-node20:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: citizen-protocol/sdk/nodejs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: citizen-protocol/sdk/nodejs/package-lock.json
      - run: npm ci
      - run: npm test

  sdk-package-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: citizen-protocol/sdk/nodejs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: citizen-protocol/sdk/nodejs/package-lock.json
      - run: npm ci
      - run: npm pack --dry-run
      - name: Validate tarball file list
        run: |
          npm pack --dry-run --json | node -e '
          const fs = require("node:fs");
          const output = fs.readFileSync(0, "utf8");
          const parsed = JSON.parse(output);

          const expected = [
            "README.md",
            "package.json",
            "src/index.d.ts",
            "src/index.js",
          ].sort();

          const actual = (parsed[0]?.files ?? [])
            .map((entry) => entry.path.trim())
            .sort();

          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            console.error("Unexpected package files");
            console.error("Expected:\\n" + expected.join("\\n"));
            console.error("Actual:\\n" + actual.join("\\n"));
            process.exit(1);
          }
          '

  sdk-live-node-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: citizen-protocol/sdk/nodejs/package-lock.json
      - name: Install SDK dependencies
        working-directory: citizen-protocol/sdk/nodejs
        run: npm ci
      - name: Run SDK live smoke (local non-Docker node)
        env:
          CITIZEN_NODE_MODE: local
          CITIZEN_LOCAL_PROTOCOL_DIR: citizen-protocol
          CITIZEN_LOCAL_CONFIG_PATH: config/localnet/validator-alpha.toml
          CITIZEN_NODE_HEALTH_TIMEOUT_MS: "180000"
        run: node citizen-protocol/sdk/nodejs/scripts/live_node_smoke.mjs
