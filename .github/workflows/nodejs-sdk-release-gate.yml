name: nodejs-sdk-release-gate

on:
  pull_request:
    paths:
      - "sdk/typescript/**"
      - "dapp/apps/api/**"
      - "wallet/sdk/typescript-auth/**"
      - "citizen-protocol/crates/**"
      - "citizen-protocol/config/localnet/**"
      - ".github/workflows/nodejs-sdk-release-gate.yml"
  push:
    branches:
      - main
    paths:
      - "sdk/typescript/**"
      - "dapp/apps/api/**"
      - "wallet/sdk/typescript-auth/**"
      - "citizen-protocol/crates/**"
      - "citizen-protocol/config/localnet/**"
      - ".github/workflows/nodejs-sdk-release-gate.yml"

jobs:
  sdk-unit-node22:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm test

  sdk-unit-node20:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm test

  sdk-package-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run
      - name: Validate tarball file list
        run: |
          npm pack --dry-run --json | node -e '
          const fs = require("node:fs");
          const output = fs.readFileSync(0, "utf8");
          const parsed = JSON.parse(output);

          const actual = (parsed[0]?.files ?? [])
            .map((entry) => entry.path.trim());
          const actualSet = new Set(actual);

          const required = ["README.md", "package.json"];
          const missing = required.filter((r) => !actualSet.has(r));
          if (missing.length > 0) {
            console.error("Missing required files:", missing);
            process.exit(1);
          }

          const forbidden = ["node_modules", "src/", "test/", "scripts/", "tsconfig", "eslint"];
          const violations = actual.filter((p) =>
            forbidden.some((f) => p.startsWith(f) || p.endsWith(f))
          );
          if (violations.length > 0) {
            console.error("Forbidden files/dirs in tarball:", violations);
            process.exit(1);
          }

          const distFiles = actual.filter((p) => p.startsWith("dist/"));
          if (distFiles.length === 0) {
            console.error("No dist/ files in tarball");
            process.exit(1);
          }

          const hasEsm = distFiles.some((p) => p.startsWith("dist/esm/"));
          const hasCjs = distFiles.some((p) => p.startsWith("dist/cjs/"));
          if (!hasEsm || !hasCjs) {
            console.error("Missing ESM or CJS build output");
            process.exit(1);
          }

          console.log("Tarball valid: " + actual.length + " files, ESM + CJS present.");
          '

  wallet-auth-sdk-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet/sdk/typescript-auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wallet/sdk/typescript-auth/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  sdk-live-node-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install SDK dependencies
        working-directory: sdk/typescript
        run: npm ci
      - name: Build SDK
        working-directory: sdk/typescript
        run: npm run build
      - name: Generate QUIC TLS certificates for localnet
        run: bash citizen-protocol/scripts/generate_localnet_quic_certs.sh
      - name: Run SDK live smoke (local non-Docker node)
        env:
          CITIZEN_NODE_MODE: local
          CITIZEN_LOCAL_PROTOCOL_DIR: citizen-protocol
          CITIZEN_LOCAL_CONFIG_PATH: config/localnet/validator-alpha.toml
          CITIZEN_NODE_HEALTH_TIMEOUT_MS: "180000"
        run: node sdk/typescript/scripts/live_node_smoke.mjs
