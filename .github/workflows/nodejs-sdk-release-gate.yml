name: nodejs-sdk-release-gate

on:
  pull_request:
    paths:
      - "sdk/typescript/**"
      - "dapp/apps/api/**"
      - "wallet/sdk/typescript-auth/**"
      - "citizen-protocol/crates/**"
      - "citizen-protocol/config/localnet/**"
      - ".github/workflows/nodejs-sdk-release-gate.yml"
  push:
    branches:
      - main
    paths:
      - "sdk/typescript/**"
      - "dapp/apps/api/**"
      - "wallet/sdk/typescript-auth/**"
      - "citizen-protocol/crates/**"
      - "citizen-protocol/config/localnet/**"
      - ".github/workflows/nodejs-sdk-release-gate.yml"

jobs:
  sdk-unit-node22:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm test

  sdk-unit-node20:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm test

  sdk-package-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run
      - name: Validate tarball file list
        run: |
          npm pack --dry-run --json | node -e '
          const fs = require("node:fs");
          const output = fs.readFileSync(0, "utf8");
          const parsed = JSON.parse(output);

          const expected = new Set([
            "README.md",
            "package.json",
            "dist/cjs/index.js",
            "dist/esm/index.js",
            "dist/esm/index.d.ts",
          ]);

          const actual = (parsed[0]?.files ?? [])
            .map((entry) => entry.path.trim())
            .filter((p) => !p.endsWith(".map"));
          const actualSet = new Set(actual);

          const missing = [...expected].filter((e) => !actualSet.has(e));
          const extra = actual.filter((a) => !expected.has(a));

          if (missing.length > 0) {
            console.error("Missing expected files:", missing);
            process.exit(1);
          }
          if (extra.length > 0) {
            console.error("Unexpected files in tarball:", extra);
            process.exit(1);
          }
          console.log("Tarball file list valid.");
          '

  wallet-auth-sdk-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet/sdk/typescript-auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wallet/sdk/typescript-auth/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  sdk-live-node-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install SDK dependencies
        working-directory: sdk/typescript
        run: npm ci
      - name: Run SDK live smoke (local non-Docker node)
        env:
          CITIZEN_NODE_MODE: local
          CITIZEN_LOCAL_PROTOCOL_DIR: citizen-protocol
          CITIZEN_LOCAL_CONFIG_PATH: config/localnet/validator-alpha.toml
          CITIZEN_NODE_HEALTH_TIMEOUT_MS: "180000"
        run: node sdk/typescript/scripts/live_node_smoke.mjs
