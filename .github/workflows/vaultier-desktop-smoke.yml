name: Vaultier Desktop Smoke Matrix

on:
  pull_request:
    paths:
      - 'vaultier/**'
      - 'wallet/desktop/**'
      - '.github/workflows/vaultier-desktop-smoke.yml'
  push:
    branches: [ main ]
    paths:
      - 'vaultier/**'
      - 'wallet/desktop/**'
      - '.github/workflows/vaultier-desktop-smoke.yml'

jobs:
  vaultier-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: vaultier/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: vaultier
        run: pnpm install --frozen-lockfile

      - name: Run desktop WB-mode smoke + contract checks
        working-directory: vaultier
        run: pnpm test:headless-contract
