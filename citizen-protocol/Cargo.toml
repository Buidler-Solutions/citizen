[workspace]
members = [
    "crates/types",
    "crates/crypto",
    "crates/consensus",
    "crates/ledger",
    "crates/governance",
    "crates/network",
    "crates/storage",
    "crates/api",
    "crates/txpool",
    "crates/node",
    "crates/simulation",
    "crates/wallet",
    "wallet/cli",
]
resolver = "2"

[workspace.package]
authors = ["Citizen Protocol <dev@citizen.org>"]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
parking_lot = "0.12"
rand = "0.8"
blake3 = "1.3"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
prost = "0.12"
bytes = "1"
axum = { version = "0.7", features = ["macros"] }
serde_with = "3.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
anyhow = "1.0"
hex = "0.4"
futures = "0.3"
libp2p = { version = "0.56", features = ["tokio", "tcp", "dns", "gossipsub", "noise", "tls", "macros"] }
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio", "log"] }
rcgen = "0.14"
bincode = "1.3"
rocksdb = { version = "0.21", features = ["static"] }

[patch.crates-io]
rocksdb = { path = "vendor/rocksdb" }
rustls-webpki = { path = "vendor/rustls-webpki" }

[workspace.metadata]
name = "citizen-protocol"
