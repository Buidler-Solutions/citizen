[workspace]
members = [
    "crates/types",
    "crates/crypto",
    "crates/consensus",
    "crates/ledger",
    "crates/governance",
    "crates/network",
    "crates/storage",
    "crates/api",
    "crates/node",
    "crates/simulation",
]
resolver = "2"

[workspace.package]
authors = ["Citizen Protocol <dev@citizen.org>"]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
parking_lot = "0.12"
rand = "0.8"
blake3 = "1.3"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
prost = "0.12"
bytes = "1"
axum = { version = "0.7", features = ["macros"] }
serde_with = "3.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
anyhow = "1.0"
hex = "0.4"

[workspace.metadata]
name = "citizen-protocol"
