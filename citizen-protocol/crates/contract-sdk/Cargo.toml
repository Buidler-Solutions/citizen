[package]
name = "citizen-contract-sdk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Civitas SDK for writing Citizen Protocol smart contracts that compile to WASM"

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
