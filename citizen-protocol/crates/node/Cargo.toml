[package]
name = "citizen-node"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
citizen-types = { path = "../types" }
citizen-crypto = { path = "../crypto" }
citizen-consensus = { path = "../consensus" }
citizen-ledger = { path = "../ledger" }
citizen-governance = { path = "../governance" }
citizen-network = { path = "../network" }
citizen-storage = { path = "../storage", features = ["rocksdb-backend"] }
citizen-api = { path = "../api" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
toml = "0.8"
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
uuid = { version = "1", features = ["v4"] }
