name = "futurenet"
description = "Citizen developer-stage futurenet for staging upgrades and governance rehearsals"
block_time_millis = 1000
quorum_bps = 8000

[namespaces]
identity = "identity.citizen"
land = "registry.land"
audit = "audit.procurement"
