# Sample operator config for Citizen testnet.
# Copy this file, replace all REPLACE_* placeholders, and run:
# cargo run -p citizen-node -- <path-to-your-config>

node_role = "validator"
validator_id = "testnet-validator-alpha"
network_id = "citizen-testnet"
block_time_millis = 1000
quorum_bps = 8000
signing_key_hex = "REPLACE_WITH_32_BYTE_SECRET_HEX"
api_port = 8281
api_auth_required = true
api_require_builder_credit_for_all_writes = true
api_max_write_requests_per_minute = 120
data_dir = "data/testnet-validator-alpha"
bind_addr = "0.0.0.0:9300"
network_key_rotation_secs = 3600
manifest_enforce = true
# Must point to a signed admission manifest JSON artifact (not testnets/*.toml).
manifest_path = "REPLACE_WITH_SIGNED_MANIFEST_JSON_PATH"
startup_secret = "REPLACE_WITH_NETWORK_STARTUP_SECRET"

[[api_clients]]
api_key = "REPLACE_WITH_BUILDER_KEY"
scopes = ["entries.submit", "envelopes.submit"]

[[namespaces]]
descriptor.namespace = "identity.citizen"
descriptor.version = 1
descriptor.rules_hash = "sha256:identity-testnet-v1"
descriptor.governed_by = "governance.vote"
writers = ["registry.identity"]
[[namespaces.validators]]
name = "require_signature"
config = {}

[[namespaces]]
descriptor.namespace = "registry.land"
descriptor.version = 1
descriptor.rules_hash = "sha256:land-testnet-v1"
descriptor.governed_by = "governance.vote"
writers = ["registry.land"]
[[namespaces.validators]]
name = "require_signature"
config = {}
[[namespaces.validators]]
name = "prevent_double_transfer"
config.object_id = "object_id"

[[namespaces]]
descriptor.namespace = "audit.procurement"
descriptor.version = 1
descriptor.rules_hash = "sha256:audit-testnet-v1"
descriptor.governed_by = "governance.vote"
writers = ["audit.procurement"]
[[namespaces.validators]]
name = "require_signature"
config = {}

[[namespaces]]
descriptor.namespace = "governance.vote"
descriptor.version = 1
descriptor.rules_hash = "sha256:governance-testnet-v1"
descriptor.governed_by = "governance.vote"
writers = ["governance.vote"]
[[namespaces.validators]]
name = "require_signature"
config = {}

[[namespaces]]
descriptor.namespace = "forms.commitment"
descriptor.version = 1
descriptor.rules_hash = "sha256:forms-commitment-v1"
descriptor.governed_by = "governance.vote"
writers = ["forms.commitment"]
[[namespaces.validators]]
name = "require_signature"
config = {}
[[namespaces.validators]]
name = "require_payload_fields"
config.fields = ["data_hash", "encrypted_form_url"]

[[validators]]
validator_id = "testnet-validator-beta"
public_key = "REPLACE_WITH_BETA_VERIFYING_KEY_HEX"
anchors = ["org:beta-institution"]

[[validators]]
validator_id = "testnet-validator-gamma"
public_key = "REPLACE_WITH_GAMMA_VERIFYING_KEY_HEX"
anchors = ["org:gamma-institution"]

[[peers]]
validator_id = "testnet-validator-beta"
address = "beta.testnet.citizen.example:9301"

[[peers]]
validator_id = "testnet-validator-gamma"
address = "gamma.testnet.citizen.example:9302"
