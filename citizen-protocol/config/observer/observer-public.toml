node_role = "observer"
validator_id = "observer.public"
api_port = 8090

# Observer profile: no consensus voting/proposer participation and no write API routes.
# Writes to /api/v1/entries/submit and /api/v1/envelopes/submit are rejected with HTTP 403.
api_auth_required = false
api_max_write_requests_per_minute = 60
network_key_rotation_secs = 3600

# Optional persistent state path for replay/rebuild and public query durability.
data_dir = "data/observer-public"

# Optionally mirror governance-approved validators for admission filtering when peers are configured.
# [[validators]]
# validator_id = "validator-alpha"
# public_key = "<hex-verifying-key>"
# anchors = ["institution:alpha"]

# Optional peer list when receiving consensus traffic from production validators.
# [[peers]]
# validator_id = "validator-alpha"
# address = "203.0.113.10:9000"
