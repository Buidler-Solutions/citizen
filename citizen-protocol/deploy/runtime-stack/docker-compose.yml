services:
  citizen-node:
    build:
      context: ../..
      dockerfile: deploy/runtime-stack/Dockerfile
    container_name: citizen-node-runtime
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9100:9100"
      - "9200:9200"
    volumes:
      - ${NODE_CONFIG_HOST_PATH:-../../config/node.toml}:${CONTAINER_NODE_CONFIG_PATH:-/etc/citizen/node.toml}:ro
      - ${SIGNED_MANIFEST_HOST_PATH:-../../config/signed-manifest.json}:${CONTAINER_MANIFEST_PATH:-/etc/citizen/signed-manifest.json}:ro
      - citizen_node_data:/var/lib/citizen
    command: ["${CONTAINER_NODE_CONFIG_PATH:-/etc/citizen/node.toml}"]

volumes:
  citizen_node_data:
