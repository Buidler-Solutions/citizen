version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: citizen-explorer-postgres
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: citizen_explorer
      POSTGRES_USER: citizen
      POSTGRES_PASSWORD: citizen
    volumes:
      - citizen_explorer_data:/var/lib/postgresql/data

volumes:
  citizen_explorer_data:
