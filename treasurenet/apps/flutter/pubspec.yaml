name: treasurenet_mobile
description: TreasureNet Citizen Edition player app — device Ed25519 wallet, GPS clue hunts, photo-proof claims with finality receipts.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  cryptography: ^2.7.0
  convert: ^3.1.2
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
