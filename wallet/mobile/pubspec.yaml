name: citizen_wallet_mobile
description: Bahandi — mobile wallet for the Citizen Protocol. Client-facing wallet for signing, decryption, vault management, and direct submit.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  cryptography: ^2.7.0
  convert: ^3.1.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8
  walletconnect_flutter_v2: ^2.3.0
  mobile_scanner: ^5.2.3
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
